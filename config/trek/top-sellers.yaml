# Locked Trek US scan scope, enumerated 2026-10-25.
# Ten adult, non-e-bike families across mountain, road, and gravel.
# Every complete bike Trek US currently lists for those families is included:
# every size, color, and generation still on the family category.
# Framesets are out. E-bikes (names with +) are out. Kids' bikes are out.
# The list does not change between runs. Re-enumerate only when Trek's catalog changes.
#
# How the ten were chosen:
# Trek's own best-selling collections sort by Featured. That order is the rank.
# US road: https://www.trekbikes.com/us/en_US/collections/best-selling-road-bikes/c/P405/
# US mountain: https://www.trekbikes.com/us/en_US/collections/best-selling-mountain-bikes/c/P406/
# There is no separate popular control on those pages.
# Corroboration: The Pro's Closet 2024 popularity ranking,
# https://www.theproscloset.com/collections/trek
# Cyclingnews on Marlin, and Trek's trail page calling Fuel EX its most popular trail bike.
# Left out despite a higher resale rank because Trek US lists no complete bike:
# Emonda, Top Fuel, Boone, Remedy. Speed Concept is triathlon, not road or gravel.
# Gravel sales evidence is Checkpoint. Checkmate is only the other drop-bar gravel family.
families:
- family: Checkpoint
  category: gravel
  source_url: https://www.trekbikes.com/us/en_US/collections/best-selling-road-bikes/c/P405/
  evidence: "Trek US best-selling road bikes, Featured order fetched 2026-10-25. Featured is the only rank; the page has no separate popular sort. Acoustic positions 4, 6, 7, 8, and 9 are Checkpoint SL 7 AXS Gen 3, SL 5 AXS Gen 3, ALR 5 Gen 3, ALR 4 Gen 3, and ALR 3 Gen 3. Position 3 is the Checkpoint+ e-bike, which is excluded. Five of the eight acoustic bikes on that ten-bike list are Checkpoint, so gravel volume is this family."
- family: Domane
  category: road
  source_url: https://www.trekbikes.com/us/en_US/collections/best-selling-road-bikes/c/P405/
  evidence: "Same US list, position 1, is Domane SLR 9 AXS No. 76 Gen 5. Trek GB's same collection also lists the volume bikes Domane SL 6 Gen 4 and Domane AL 2 Gen 4: https://www.trekbikes.com/gb/en_GB/collections/best-selling-road-bikes/c/P405/. The Pro's Closet ranks Domane first of 15 Trek families by 2024 popularity: https://www.theproscloset.com/collections/trek."
- family: Madone
  category: road
  source_url: https://www.trekbikes.com/us/en_US/collections/best-selling-road-bikes/c/P405/
  evidence: "Same US list, position 2 is Madone SLR 7 Gen 8 and position 5 is Madone SL 7 Gen 8. The Pro's Closet ranks Madone fifth: https://www.theproscloset.com/collections/trek."
- family: Marlin
  category: mountain
  source_url: https://www.trekbikes.com/us/en_US/collections/best-selling-mountain-bikes/c/P406/
  evidence: "Trek US best-selling mountain bikes, Featured order fetched 2026-10-25. Positions 1 and 2 are e-bikes (Fuel+ EX and Marlin+). The first acoustic bikes are position 3 Marlin 5 Gen 3 and position 4 Marlin 4 Gen 3. Cyclingnews calls the Marlin family Trek's best-selling mountain bikes: https://www.cyclingnews.com/bikes/mountain/best-budget-mountain-bikes/. Cycles UK's 4 Mar 2026 unit ranking puts Marlin 5 first and Marlin 4 second: https://www.cyclesuk.com/blog/top-10-mountain-bikes/."
- family: Fuel EX
  category: mountain
  source_url: https://www.trekbikes.com/us/en_US/trail-mountain-bikes/
  evidence: "Trek's US trail page says Fuel EX is \"our most popular trail bike\" (fetched 2026-10-25). The Pro's Closet ranks Fuel fourth, with Domane+ listed separately, so this is the acoustic Fuel line: https://www.theproscloset.com/collections/trek. P406 position 1 is the Fuel+ EX e-bike, which is excluded. Fuel MX and Fuel LX are separate families and are not included."
- family: Supercaliber
  category: mountain
  source_url: https://www.trekbikes.com/us/en_US/collections/best-selling-mountain-bikes/c/P406/
  evidence: "Trek US best-selling mountain bikes, Featured position 5, Supercaliber SL 9.7 GX AXS Gen 2. The Pro's Closet ranks Supercaliber eighth: https://www.theproscloset.com/collections/trek. This replaces Top Fuel. Trek US currently lists only Top Fuel framesets, and Top Fuel 8 is not in the US search index."
- family: Roscoe
  category: mountain
  source_url: https://www.trekbikes.com/us/en_US/collections/best-selling-mountain-bikes/c/P406/
  evidence: "Trek US best-selling mountain bikes, Featured positions 6 and 7: Roscoe 8 Gen 4 and Roscoe 7 Gen 4. Roscoe 8 without a generation tag is also on the current Roscoe category, so it is included."
- family: Slash
  category: mountain
  source_url: https://www.theproscloset.com/collections/trek
  evidence: "The Pro's Closet 2024 popularity rank 11. Slash is not on P406. It is the next mountain family that Trek US still sells as a complete bike after Top Fuel (rank 6) and Remedy (rank 13), both framesets only. Trek's trail page lists the family: https://www.trekbikes.com/us/en_US/trail-mountain-bikes/."
- family: Procaliber
  category: mountain
  source_url: https://www.theproscloset.com/collections/trek
  evidence: "The Pro's Closet 2024 popularity rank 15. Procaliber is not on P406. It is the last complete-bike mountain family on that resale ranking. Current US listings are the cross-country hardtails at https://www.trekbikes.com/us/en_US/bikes/mountain-bikes/cross-country-mountain-bikes/procaliber/f/F312/."
- family: Checkmate
  category: gravel
  source_url: https://www.trekbikes.com/us/en_US/bikes/road-bikes/gravel-bikes/drop-bar-gravel-bikes/checkmate/f/F225/
  evidence: "Not on the US P405 best-seller list and not in The Pro's Closet top 15. Included because it is the only other acoustic drop-bar gravel family Trek US currently lists. The Pro's Closet says Checkpoint and Domane rule Trek's gravel line: https://www.theproscloset.com/collections/trek. Higher resale ranks with no current complete bike were left out: Emonda (2), Top Fuel (6), Boone (10), Remedy (13). Speed Concept (9) is a triathlon bike and is outside mountain, road, and gravel."
