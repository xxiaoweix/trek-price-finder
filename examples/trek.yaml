# Map settings for a Trek price scan.
# The bike below is a placeholder so this file is valid. It is not a
# recommendation. `scan --model` looks up a real bike from Trek's public
# catalog when the name does not match "Example Bike".
# `price-board` ignores this bike and reads config/trek/top-sellers.yaml.
version: 2
locally:
  company_id: 3480
  center_lat: 39.8283
  center_lng: -98.5795
  radius_miles: 2000
  page_limit: 100

scan:
  default_profile: canary
  profiles:
    canary:
      coverage: points
      points:
        - label: Denver, CO
          lat: 39.7525
          lng: -104.9995
          distance_diag: 100
    regional:
      coverage: points
      points:
        - {label: "New York, NY", lat: 40.7128, lng: -74.0060, distance_diag: 140}
        - {label: "Los Angeles, CA", lat: 34.0522, lng: -118.2437, distance_diag: 140}
        - {label: "Denver, CO", lat: 39.7525, lng: -104.9995, distance_diag: 140}
        - {label: "Dallas, TX", lat: 32.7767, lng: -96.7970, distance_diag: 140}
        - {label: "Atlanta, GA", lat: 33.7490, lng: -84.3880, distance_diag: 140}
        - {label: "Billings, MT", lat: 45.7833, lng: -108.5007, distance_diag: 160}
        - {label: "Portland, OR", lat: 45.5152, lng: -122.6784, distance_diag: 140}
    conus:
      coverage: conus
      # 300 miles stays unsaturated in most of the country. Dense cities subdivide.
      initial_distance_diag: 300
      minimum_distance_diag: 45
      max_depth: 3
      overlap: 0.30

watches:
  - key: example_bike
    canonical_name: Example Bike
    aliases:
      - Example Bike
    exclusions: []
    allowed_sizes: ["M"]
    baseline_usd: 1000.00
    msrp_usd: 1000.00
    locally:
      variants:
        - upc: "000000000000"
          product_id: 1
          style: example
          size: M
          color: Example
      seed_store_ids: []
