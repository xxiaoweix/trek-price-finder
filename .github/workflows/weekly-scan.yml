name: Trek top sellers
on:
  schedule:
    - cron: "15 14 * * 0"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
concurrency:
  group: trek-price-finder-weekly-scan
  cancel-in-progress: false
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
  PYTHONPATH: src
  TRACKER_MIN_HOST_INTERVAL_SECONDS: "0.05"
  TRACKER_GLOBAL_MIN_INTERVAL_SECONDS: "0.15"
  TRACKER_SCAN_WORKERS: "8"
  TRACKER_OFFICIAL_STORE_AUDIT_ENABLED: "false"
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Scan top sellers
        run: |
          set -euo pipefail
          python -m bike_price_alerts.cli price-board \
            --profile conus \
            --db data/top-sellers.sqlite3 \
            --out site/data/prices.json \
            --no-resume \
            --fail-on-partial
      - uses: actions/upload-artifact@v6
        with:
          name: trek-top-sellers-${{ github.run_id }}
          path: site/data/prices.json
      - name: Summarize the scan
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json
          d = json.load(open("site/data/prices.json"))
          def family(model):
              two = " ".join(model.split()[:2])
              return two if two in {"Fuel EX", "FX Sport", "Top Fuel", "Dual Sport"} else model.split()[0]
          models, offers = collections.defaultdict(set), collections.Counter()
          for o in d["offers"]:
              models[family(o["model"])].add(o["model"])
              offers[family(o["model"])] += 1
          print(f"offers={d['offer_count']} skipped={d['skipped_offer_count']} "
                f"models={sum(map(len, models.values()))} upcs={len(d['upc_lows'])}\n")
          print("| family | models | offers |\n|---|---|---|")
          for name in sorted(offers):
              print(f"| {name} | {len(models[name])} | {offers[name]} |")
          PY
      - name: Commit the price dataset
        # Only main publishes data; test branches keep the result as the artifact above.
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Trek top-seller prices"
          git push
